services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arenahub
      POSTGRES_USER: arenahub
      POSTGRES_PASSWORD: arenahub
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U arenahub -d arenahub"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - arenahub_pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  backend:
    build: ./backend
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://arenahub:arenahub@db:5432/arenahub
      JWT_SECRET: change-this-secret-in-production
      JWT_EXPIRES_IN: 8h
      CLIENT_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports: ["5173:80"]
volumes:
  arenahub_pgdata:
